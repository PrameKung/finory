name: finory

services:
  api:
    build:
      context: ../../backend/service
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      AUTH_DATABASE_URL: "${AUTH_DATABASE_URL:?Set AUTH_DATABASE_URL in .env.local}"
      LEDGER_DATABASE_URL: "${LEDGER_DATABASE_URL:?Set LEDGER_DATABASE_URL in .env.local}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env.local}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env.local}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:?Set GOOGLE_REDIRECT_URL in .env.local}"
      APP_REDIRECT_URL: "${APP_REDIRECT_URL:?Set APP_REDIRECT_URL in .env.local}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.local}"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
